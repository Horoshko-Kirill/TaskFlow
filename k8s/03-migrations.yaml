apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: taskflow-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: taskflow-migrations:latest
          imagePullPolicy: Never
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: Database__ConnectionString