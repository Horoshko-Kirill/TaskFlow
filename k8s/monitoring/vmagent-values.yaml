
fullnameOverride: vm-single-victoria-metrics-agent

replicaCount: 1

rbac:
  create: true
  namespaced: false

service:
  enabled: true
  type: ClusterIP
  servicePort: "8429"

remoteWrite:
  - url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write

config:
  global:
    scrape_interval: 15s
    scrape_timeout: 10s

  scrape_configs:
    - job_name: vmagent
      static_configs:
        - targets:
            - localhost:8429

    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod

      relabel_configs:
        - action: drop
          source_labels:
            - __meta_kubernetes_pod_container_init
          regex: "true"

        - action: keep
          source_labels:
            - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          regex: "true"

        - action: keep_if_equal
          source_labels:
            - __meta_kubernetes_pod_annotation_prometheus_io_port
            - __meta_kubernetes_pod_container_port_number

        - action: replace
          source_labels:
            - __meta_kubernetes_pod_annotation_prometheus_io_path
          target_label: __metrics_path__
          regex: (.+)

        - action: replace
          source_labels:
            - __address__
            - __meta_kubernetes_pod_annotation_prometheus_io_port
          target_label: __address__
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2

        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)

        - source_labels:
            - __meta_kubernetes_pod_name
          target_label: pod

        - source_labels:
            - __meta_kubernetes_namespace
          target_label: namespace

        - source_labels:
            - __meta_kubernetes_pod_container_name
          target_label: container

        - source_labels:
            - __meta_kubernetes_pod_node_name
          target_label: node

    - job_name: taskflow-blackbox
      metrics_path: /probe
      params:
        module: [http_2xx]

      static_configs:
        - targets:
            - http://taskflow-api.default.svc.cluster.local:8080/openapi/v1.json

      relabel_configs:
        - source_labels:
            - __address__
          target_label: __param_target

        - source_labels:
            - __param_target
          target_label: instance

        - target_label: __address__
          replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
