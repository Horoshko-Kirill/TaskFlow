
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: grafana
      group_by:
        - alertname
        - service
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h

    receivers:
      - name: grafana
