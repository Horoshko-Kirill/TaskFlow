apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.43.1
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/victoria-logs-data"
            - "-retentionPeriod=7d"
            - "-httpListenAddr=:9428"
          ports:
            - name: http
              containerPort: 9428
          volumeMounts:
            - name: storage
              mountPath: /victoria-logs-data
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: victoria-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
spec:
  type: ClusterIP
  selector:
    app: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: 9428