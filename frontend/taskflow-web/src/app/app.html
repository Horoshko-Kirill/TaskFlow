<div class="app-shell">
  <header class="topbar">
    <a routerLink="/projects" class="brand">
      <div class="brand-icon">T</div>

      <div>
        <strong>TaskFlow</strong>
        <span>Project management</span>
      </div>
    </a>

    <nav>
      <a
        routerLink="/projects"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Projects
      </a>

      <a
        routerLink="/my-tasks"
        routerLinkActive="active">
        My Tasks
      </a>

      <a
        routerLink="/users"
        routerLinkActive="active">
        Users
      </a>
    </nav>
  </header>

  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
